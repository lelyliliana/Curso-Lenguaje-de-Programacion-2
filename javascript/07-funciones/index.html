<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 07 - Funciones</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="encabezado">

    <p class="nombre-curso">
        Lenguaje de Programación II
    </p>

    <h1>Laboratorio 07</h1>

    <h2>Funciones</h2>

    <p class="objetivo">
        Aprender a crear funciones reutilizables utilizando parámetros
        y valores de retorno.
    </p>

</header>

<main class="contenedor">

<section class="tarjeta">

<h2>Área de experimentación</h2>

<label>Base</label>

<input
    type="number"
    id="base"
>

<label>Altura</label>

<input
    type="number"
    id="altura"
>

<div class="botones">

<button id="calcular">

Calcular área

</button>

<button id="limpiar">

Limpiar

</button>

</div>

</section>

<section class="tarjeta">

<h2>Resultado</h2>

<div
id="resultado"
class="resultado">

Esperando datos...

</div>

</section>

<section class="tarjeta">

<h2>Reto</h2>

<p>

Crear otra función para calcular el área
de un cuadrado.

</p>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
