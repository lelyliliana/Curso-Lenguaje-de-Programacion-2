<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 06 - Ciclos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="encabezado">

    <p class="nombre-curso">
        Lenguaje de Programación II
    </p>

    <h1>Laboratorio 06</h1>

    <h2>Ciclo for</h2>

    <p class="objetivo">
        Generar una secuencia de números utilizando un ciclo
        <code>for</code>.
    </p>

</header>

<main class="contenedor">

<section class="tarjeta">

<h2>Área de experimentación</h2>

<label>

¿Cuántos números desea generar?

</label>

<input
    type="number"
    id="cantidad"
    min="1"
    max="100"
>

<div class="botones">

<button id="generar">

Generar

</button>

<button id="limpiar">

Limpiar

</button>

</div>

</section>

<section class="tarjeta">

<h2>Resultado</h2>

<div
id="resultado"
class="resultado">

Esperando datos...

</div>

</section>

<section class="tarjeta">

<h2>Reto</h2>

<p>

Modificar el programa para generar solamente
los números pares.

</p>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
