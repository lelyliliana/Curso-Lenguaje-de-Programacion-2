<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratorio 05 - Condicionales</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="encabezado">

    <p class="nombre-curso">
        Lenguaje de Programación II
    </p>

    <h1>Laboratorio 05</h1>

    <h2>Condicionales</h2>

    <p class="objetivo">
        Aprender a tomar decisiones utilizando
        <code>if</code>,
        <code>else if</code>
        y
        <code>else</code>.
    </p>

</header>

<main class="contenedor">

<section class="tarjeta">

<h2>Área de experimentación</h2>

<label>Ingrese su edad</label>

<input
    type="number"
    id="edad"
    min="0"
>

<div class="botones">

<button id="verificar">

Verificar

</button>

<button id="limpiar">

Limpiar

</button>

</div>

</section>

<section class="tarjeta">

<h2>Resultado</h2>

<div
id="resultado"
class="resultado">

Esperando datos...

</div>

</section>

<section class="tarjeta">

<h2>Reto</h2>

<p>

Modifique el programa para clasificar también:

<ul>

<li>Adulto mayor</li>

<li>Persona jubilada</li>

</ul>

</p>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
