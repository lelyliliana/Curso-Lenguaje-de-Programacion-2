<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 08 - Arrays</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="encabezado">

    <p class="nombre-curso">
        Lenguaje de Programación II
    </p>

    <h1>Laboratorio 08</h1>

    <h2>Arrays</h2>

    <p class="objetivo">
        Aprender a crear, recorrer y modificar arreglos en JavaScript.
    </p>

</header>

<main class="contenedor">

<section class="tarjeta">

<h2>Área de experimentación</h2>

<label>Nombre del estudiante</label>

<input
    type="text"
    id="nombre"
    placeholder="Ingrese un nombre"
>

<div class="botones">

<button id="agregar">

Agregar

</button>

<button id="mostrar">

Mostrar lista

</button>

<button id="limpiar">

Limpiar

</button>

</div>

</section>

<section class="tarjeta">

<h2>Lista de estudiantes</h2>

<div
id="resultado"
class="resultado">

No hay estudiantes registrados.

</div>

</section>

<section class="tarjeta">

<h2>Reto</h2>

<p>

Crear un botón para eliminar el último estudiante agregado.

</p>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
