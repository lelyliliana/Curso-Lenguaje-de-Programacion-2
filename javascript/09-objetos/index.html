<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 09 - Objetos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="encabezado">

    <p class="nombre-curso">
        Lenguaje de Programación II
    </p>

    <h1>Laboratorio 09</h1>

    <h2>Objetos</h2>

    <p class="objetivo">
        Aprender a representar información mediante objetos en JavaScript.
    </p>

</header>

<main class="contenedor">

<section class="tarjeta">

<h2>Área de experimentación</h2>

<label>Nombre</label>

<input
    type="text"
    id="nombre"
>

<label>Programa</label>

<input
    type="text"
    id="programa"
>

<label>Semestre</label>

<input
    type="number"
    id="semestre"
>

<div class="botones">

<button id="crear">

Crear objeto

</button>

<button id="limpiar">

Limpiar

</button>

</div>

</section>

<section class="tarjeta">

<h2>Objeto creado</h2>

<div
id="resultado"
class="resultado">

Esperando información...

</div>

</section>

<section class="tarjeta">

<h2>Reto</h2>

<p>

Agregar una propiedad llamada <strong>correo</strong> al objeto estudiante y mostrarla en pantalla.

</p>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
