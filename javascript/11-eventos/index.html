<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Laboratorio 11 - Eventos</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="encabezado">

    <p class="nombre-curso">
        Lenguaje de Programación II
    </p>

    <h1>Laboratorio 11</h1>

    <h2>Eventos</h2>

    <p class="objetivo">
        Responder a las acciones realizadas por el usuario.
    </p>

</header>

<main class="contenedor">

<section class="tarjeta">

<h2>Área de experimentación</h2>

<input
    type="text"
    id="nombre"
    placeholder="Escriba su nombre">

<br><br>

<button id="boton">

Interactuar

</button>

</section>

<section class="tarjeta">

<h2>Resultado</h2>

<div
id="resultado"
class="resultado">

Esperando interacción...

</div>

</section>

<section class="tarjeta">

<h2>Reto</h2>

<p>

Agregar un evento cuando el usuario salga de la caja de texto.

</p>

</section>

</main>

<script src="script.js"></script>

</body>

</html>
